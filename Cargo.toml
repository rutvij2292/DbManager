[workspace]
resolver = "2"
members = ["src-tauri", "crates/dbcore", "crates/driver-sqlite", "crates/driver-postgres", "crates/driver-mysql", "crates/driver-mssql", "crates/driver-redis", "crates/driver-mongo", "crates/dataio", "crates/tableplus-import", "crates/dbbackup"]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
