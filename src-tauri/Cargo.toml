[package]
name = "lattice"
version = "0.9.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "time"] }
dbcore = { path = "../crates/dbcore" }
driver-sqlite = { path = "../crates/driver-sqlite" }
driver-postgres = { path = "../crates/driver-postgres" }
driver-mysql = { path = "../crates/driver-mysql" }
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
driver-mssql = { path = "../crates/driver-mssql" }
driver-redis = { path = "../crates/driver-redis" }
driver-mongo = { path = "../crates/driver-mongo" }
dataio = { path = "../crates/dataio" }
tableplus-import = { path = "../crates/tableplus-import" }
