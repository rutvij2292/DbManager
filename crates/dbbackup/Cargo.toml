[package]
name = "dbbackup"
version = "0.1.0"
edition = "2021"

[dependencies]
dbcore = { path = "../dbcore" }
serde.workspace = true
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
driver-sqlite = { path = "../driver-sqlite" }
tokio.workspace = true
driver-mysql = { path = "../driver-mysql" }
driver-postgres = { path = "../driver-postgres" }
