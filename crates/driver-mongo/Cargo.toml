[package]
name = "driver-mongo"
version = "0.1.0"
edition = "2021"

[dependencies]
dbcore = { path = "../dbcore" }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util = "0.3"
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-0-0", "compat-3-3-0"] }

[dev-dependencies]
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-0-0", "compat-3-3-0"] }
